[package]
name = "prooftask"
version = "0.1.0"
description = "ProofTask escrow marketplace for human AI microtasks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prooftask"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
